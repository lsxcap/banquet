<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>我们的记账</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:#FFF9F2;color:#1a1a1a;min-height:100vh}
.app{max-width:640px;margin:0 auto;padding-bottom:80px}
.header{background:#fff;border-bottom:0.5px solid #e8e0d8;padding:16px 20px 0;position:sticky;top:0;z-index:100}
.header-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.h-icon{width:36px;height:36px;border-radius:50%;background:#FAEEDA;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.h-title{font-size:17px;font-weight:600;cursor:pointer}
.h-sub{font-size:12px;color:#888;margin-top:1px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#ccc;margin-left:auto;flex-shrink:0;transition:background .3s}
.sync-dot.ok{background:#1D9E75}
.sync-dot.err{background:#E24B4A}
.sync-dot.ing{background:#EF9F27}
.tabs{display:flex;border-top:0.5px solid #e8e0d8}
.tab{flex:1;padding:10px 4px;font-size:13px;color:#888;cursor:pointer;border-bottom:2px solid transparent;text-align:center;display:flex;align-items:center;justify-content:center;gap:4px;transition:all .15s}
.tab.active{color:#854F0B;border-bottom-color:#BA7517;font-weight:500}
.section{display:none;padding-top:4px}.section.active{display:block}
.countdown{margin:16px 16px 0;background:#FAEEDA;border-radius:14px;padding:20px;border:0.5px solid #EF9F27;text-align:center}
.cd-num{font-size:56px;font-weight:700;color:#633806;line-height:1;letter-spacing:-2px}
.cd-label{font-size:13px;color:#854F0B;margin-top:6px}
.cd-date{font-size:12px;color:#BA7517;margin-top:2px}
.editable{display:inline-block;border-bottom:1px dashed transparent;cursor:pointer;transition:border-color .2s}
.editable:hover{border-bottom-color:#BA7517}
.inline-edit-input{border:0.5px solid #BA7517;border-radius:4px;padding:2px 4px;font:inherit;color:inherit;background:#fff;outline:none;width:auto;min-width:80px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 16px}
.stat{background:#fff;border-radius:10px;padding:10px 12px;border:0.5px solid #e8e0d8;text-align:center}
.stat-l{font-size:11px;color:#888;margin-bottom:3px}
.stat-v{font-size:20px;font-weight:600;color:#1a1a1a}
.stat-u{font-size:10px;color:#888}
.card{background:#fff;border-radius:14px;border:0.5px solid #e8e0d8;padding:14px 16px;margin:0 16px 12px;position:relative}
.card-title{font-size:12px;font-weight:500;color:#aaa;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.person-tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:500}
.tag-妥妥{background:#E1F5EE;color:#085041}
.tag-刘娟{background:#EEEDFE;color:#3C3489}
.tag-星星{background:#FBEAF0;color:#72243E}
.tag-共同{background:#F1EFE8;color:#444441}
.progress-bar{height:4px;background:#f0ebe3;border-radius:2px;margin:6px 0 10px;overflow:hidden}
.progress-fill{height:100%;background:#1D9E75;border-radius:2px;transition:width .4s}
.task-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:none}
.task-row:last-child{border-bottom:none}
.chk{width:20px;height:20px;border-radius:6px;border:1.5px solid #d0c8be;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all .15s;color:#fff}
.chk.done{background:#1D9E75;border-color:#1D9E75}
.task-body{flex:1;min-width:0}
.task-title{font-size:14px;color:#1a1a1a;line-height:1.4;cursor:pointer}
.task-title.done{text-decoration:line-through;color:#bbb}
.task-meta{display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap}
.task-cost{display:flex;align-items:center;gap:2px;font-size:12px}
.task-cost input{width:80px;padding:3px 6px;border:0.5px solid #d8d0c8;border-radius:6px;font-size:12px;color:#1a1a1a;background:#fff;outline:none;text-align:right}
.task-cost input:focus{border-color:#BA7517}
.task-cost span{color:#888;font-size:11px}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
input[type=number] {
  -moz-appearance: textfield;
}
.clear-cost{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:18px;
  height:18px;
  border-radius:50%;
  background:transparent;
  color:#ccc;
  font-size:12px;
  cursor:pointer;
  margin-left:2px;
  user-select:none;
  transition:color .2s;
}
.clear-cost:hover{color:#E24B4A}
.note-toggle{font-size:11px;color:#BA7517;cursor:pointer;display:inline-flex;align-items:center;gap:2px;user-select:none;margin-left:4px}
.task-note-input{width:100%;margin-top:5px;border:0.5px solid #e0d8d0;border-radius:7px;padding:5px 8px;font-size:12px;color:#666;font-family:inherit;background:#FFFCF8;resize:none;outline:none;display:none}
.task-note-input.show{display:block}
.task-note-input:focus{border-color:#BA7517}
.del-btn{
  background:#f0ebe3;
  border:none;
  cursor:pointer;
  color:#888;
  padding:2px 4px;
  border-radius:50%;
  width:22px;
  height:22px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  flex-shrink:0;
  transition:background .2s, color .2s;
}
.del-btn:hover{
  background:#E24B4A;
  color:#fff;
}
.add-task-inline{
  display:flex;
  align-items:center;
  gap:4px;
  color:#aaa;
  font-size:12px;
  cursor:pointer;
  padding:8px 0 4px;
  user-select:none;
  border-top:0.5px solid #f5f0ea;
}
.add-task-inline:hover{color:#BA7517}
.person-del{background:none;border:none;color:#ccc;cursor:pointer;padding:2px;margin-left:4px;display:inline-flex;align-items:center}
.person-del:hover{color:#E24B4A}
/* 强化版添加负责人按钮 */
.add-task-btn.primary-action{
  background:#FEFAF5;
  border:0.5px solid #BA7517;
  color:#854F0B;
  font-weight:500;
}
.add-task-btn.primary-action:hover{
  background:#FAC775;
}
/* 弱化版重置按钮 */
.add-task-btn.secondary-action{
  border:none;
  color:#bbb;
  font-size:12px;
  padding:6px 0;
  margin-top:40px;
}
.add-task-btn.secondary-action:hover{
  color:#aaa;
  background:transparent;
}
.add-task-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:9px;border-radius:10px;border:0.5px dashed #d0c8be;background:transparent;color:#888;font-size:13px;cursor:pointer;margin:0 0 12px;font-family:inherit}
.add-task-btn:hover{border-color:#BA7517;color:#854F0B;background:#FEFAF5}
.ledger-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:0.5px solid #f5f0ea;font-size:13px}
.ledger-row:last-child{border-bottom:none}
.amount-out{color:#A32D2D;font-weight:500}
.amount-in{color:#085041;font-weight:500}
.form-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{border:0.5px solid #d8d0c8;border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit;color:#1a1a1a;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:#BA7517}
textarea{resize:vertical;min-height:80px;width:100%}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:8px;border:0.5px solid #d8d0c8;background:#fff;color:#1a1a1a;font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s}
.btn:hover{background:#f5f0ea}
.btn-primary{background:#FAEEDA;border-color:#EF9F27;color:#633806}
.btn-primary:hover{background:#FAC775}
.guest-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:0.5px solid #f5f0ea;font-size:13px}
.guest-row:last-child{border-bottom:none}
.ledger-total{display:flex;justify-content:space-between;padding-top:10px;margin-top:6px;border-top:0.5px solid #e8e0d8;font-size:13px}
.settlement-item{display:flex;align-items:center;gap:6px;padding:6px 0;font-size:13px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1}
.empty{color:#bbb;font-size:13px;text-align:center;padding:20px 0}
.group-label{font-size:12px;color:#aaa;margin-bottom:4px;padding-left:2px;cursor:pointer}
.guest-btn{
  width:22px;height:22px;border-radius:50%;
  background:#f0ebe3;border:none;color:#666;
  font-size:16px;cursor:pointer;display:inline-flex;
  align-items:center;justify-content:center;
  line-height:1;transition:background .2s;
}
.guest-btn:hover{background:#ddd6cc}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <div class="h-icon">🎂</div>
      <div>
        <div class="h-title" id="main-title" ondblclick="editMainTitle()">我们的记账</div>
        <div class="h-sub" id="h-sub">2026年5月30日 · 共30人</div>
      </div>
      <div class="sync-dot" id="sync-dot" title="同步状态"></div>
    </div>
    <div class="tabs">
      <div class="tab active" onclick="switchTab('overview')"><i class="ti ti-layout-dashboard"></i> 概览</div>
      <div class="tab" onclick="switchTab('ledger')"><i class="ti ti-receipt"></i> 记账</div>
      <div class="tab" onclick="switchTab('guests')"><i class="ti ti-users"></i> 宾客</div>
    </div>
  </div>

  <div class="section active" id="tab-overview">
    <div class="countdown">
      <div class="cd-num" id="cd-days">--</div>
      <div class="cd-label">距离<span class="editable" id="cd-event-name" onclick="editEventName()">寿宴</span>还有（天）</div>
      <div class="cd-date">
        <span class="editable" id="cd-target-date" onclick="editTargetDate()">2026年5月30日</span>
        <span class="editable" id="cd-desc" onclick="editEventDesc()">· 椿萱同欢・晴光入宴</span>
      </div>
    </div>
    <div class="stat-grid">
      <div class="stat"><div class="stat-l">已完成 / 总任务</div><div class="stat-v" id="s-progress">0 / 0</div></div>
      <div class="stat"><div class="stat-l">宾客</div><div class="stat-v" id="s-guests">0</div><div class="stat-u">人</div></div>
      <div class="stat"><div class="stat-l">已支出</div><div class="stat-v" id="s-spend">0</div><div class="stat-u">元</div></div>
    </div>
    <div style="padding:0 16px">
      <div id="overview-persons"></div>
      <button class="add-task-btn primary-action" onclick="addPerson()"><i class="ti ti-plus"></i> 添加负责人</button>
      <button class="add-task-btn secondary-action" onclick="resetData()"><i class="ti ti-refresh"></i> 重置为默认任务列表</button>
    </div>
  </div>

  <div class="section" id="tab-ledger">
    <div style="height:12px"></div>
    <div class="card">
      <div class="card-title">新增记录</div>
      <div class="form-row">
        <input type="text" id="l-desc" placeholder="项目名称" style="flex:2;min-width:120px">
        <input type="number" id="l-amount" placeholder="金额(元)" style="width:100px" min="0">
      </div>
      <div class="form-row" style="margin-top:8px">
        <select id="l-who" style="flex:1"></select>
        <select id="l-type" style="flex:1">
          <option value="out">支出</option><option value="in">收入/报销</option>
        </select>
        <button class="btn btn-primary" onclick="addLedger()"><i class="ti ti-plus"></i> 记录</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">支出明细</div>
      <div id="ledger-list"><div class="empty">暂无记录</div></div>
      <div class="ledger-total">
        <span style="color:#888">总支出</span>
        <span id="l-total" style="font-weight:500;color:#A32D2D">0 元</span>
      </div>
    </div>
    <div class="card" id="settlement-card">
      <div class="card-title">AA 结算</div>
      <div id="settlement-content"><div class="empty">请先添加支出记录</div></div>
    </div>
  </div>

  <div class="section" id="tab-guests">
    <div style="height:12px"></div>
    <div class="card">
      <div class="card-title">宾客名单 · 共 <span id="g-count">0</span> 人</div>
      <div id="guest-list"></div>
    </div>
    <div class="card">
      <div class="card-title">添加宾客</div>
      <div class="form-row">
        <input type="text" id="g-name" placeholder="姓名/称呼" style="flex:2;min-width:120px">
        <input type="number" id="g-num" placeholder="人数" style="width:70px" min="1" value="1">
        <button class="btn btn-primary" onclick="addGuest()"><i class="ti ti-plus"></i> 添加</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const FB_URL = 'https://banquet-c03ba-default-rtdb.asia-southeast1.firebasedatabase.app/data.json';

const DEFAULT_TASKS = [
  {group:'酒店对接',owner:'妥妥',items:[
    {id:'t1',title:'确认宴会日期（2026年5月30日）',done:false,note:'',cost:0,ledgerId:null},
    {id:'t2',title:'桌数、场地费和押金',done:false,note:'',cost:0,ledgerId:null},
  ]},
  {group:'菜品与餐饮',owner:'刘娟',items:[
    {id:'t5',title:'与酒店沟通寿宴特色菜选项',done:false,note:'',cost:0,ledgerId:null},
    {id:'t14',title:'生日蛋糕：尺寸、口味、取货时间',done:false,note:'',cost:0,ledgerId:null},
  ]},
  {group:'采购与布置',owner:'星星',items:[
    {id:'t8',title:'购买爸爸寿宴衣服',done:false,note:'',cost:0,ledgerId:null},
    {id:'t10',title:'准备生日宴布置物料',done:false,note:'',cost:0,ledgerId:null},
    {id:'t11',title:'预定寿包（数量、口味确认）',done:false,note:'',cost:0,ledgerId:null},
  ]},
];

const DEFAULT_GUESTS = [
  {name:'大姑（大姑爷、刘丽家）',num:3},
  {name:'大姑家（斌斌家）',num:4},
  {name:'二姑（二姑爷、玉芝家）',num:4},
  {name:'小姑家',num:3},
  {name:'万和',num:3},
  {name:'妥妥家',num:4},
  {name:'刘娟家',num:3},
  {name:'百和叔叔',num:2},
  {name:'千和叔叔',num:2},
];

const DEFAULT_PERSONS = [
  {name:'妥妥', color:'#1D9E75'},
  {name:'刘娟', color:'#7F77DD'},
  {name:'星星', color:'#D4537E'},
];

let state = {
  tasks: JSON.parse(JSON.stringify(DEFAULT_TASKS)),
  ledger: [],
  guests: JSON.parse(JSON.stringify(DEFAULT_GUESTS)),
  persons: JSON.parse(JSON.stringify(DEFAULT_PERSONS)),
  eventDate: '2026-05-30',
  eventDesc: '椿萱同欢・晴光入宴',
  eventName: '寿宴',
  mainTitle: '我们的记账',
};

let saveTimer = null;

function normalizeTasks() {
  state.tasks.forEach(g => {
    g.items.forEach(item => {
      if (item.cost === undefined) item.cost = 0;
      if (item.ledgerId === undefined) item.ledgerId = null;
    });
  });
}

async function loadRemote() {
  setSyncDot('ing');
  try {
    const res = await fetch(FB_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data && data.tasks) {
      state = {
        tasks: data.tasks || DEFAULT_TASKS,
        ledger: data.ledger || [],
        guests: data.guests || DEFAULT_GUESTS,
        persons: data.persons || DEFAULT_PERSONS,
        eventDate: data.eventDate || '2026-05-30',
        eventDesc: data.eventDesc || '椿萱同欢・晴光入宴',
        eventName: data.eventName || '寿宴',
        mainTitle: data.mainTitle || '我们的记账',
      };
    }
    // 自动修正旧标题
    if (state.mainTitle === '69岁生日宴') state.mainTitle = '我们的记账';
    normalizeTasks();
    setSyncDot('ok');
  } catch(e) {
    console.error(e);
    setSyncDot('err');
    showToast('加载云端失败，使用本地默认');
  }
  renderAll();
}

async function saveRemote() {
  setSyncDot('ing');
  try {
    const res = await fetch(FB_URL, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(state)
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    setSyncDot('ok');
  } catch(e) {
    console.error(e);
    setSyncDot('err');
    showToast('同步失败');
  }
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveRemote, 800);
}

function setSyncDot(s) {
  const d = document.getElementById('sync-dot');
  d.className = 'sync-dot' + (s ? ' '+s : '');
  d.title = s==='ok'?'已同步':s==='ing'?'同步中...':s==='err'?'同步失败':'';
}

function switchTab(t) {
  const tabs = ['overview', 'ledger', 'guests'];
  document.querySelectorAll('.tab').forEach((el,i)=>{
    el.classList.toggle('active', tabs[i] === t);
  });
  document.querySelectorAll('.section').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
}

function renderAll() {
  updateMainTitle();
  countdown();
  renderOverview();
  renderLedger();
  renderGuests();
  updateHeaderSub();
}

function updateMainTitle() {
  document.getElementById('main-title').textContent = state.mainTitle;
  document.title = state.mainTitle;
}

function updateHeaderSub() {
  const dateStr = formatDate(state.eventDate);
  const totalGuests = state.guests.reduce((s,g)=>s+g.num, 0);
  document.getElementById('h-sub').textContent = `${dateStr} · 共${totalGuests}人`;
}

function countdown() {
  const target = new Date(state.eventDate + 'T00:00:00');
  const now = new Date();
  const diff = Math.ceil((target - now) / (1000*60*60*24));
  document.getElementById('cd-days').textContent = diff > 0 ? diff : (diff === 0 ? '今天' : '已过');
  document.getElementById('cd-target-date').textContent = formatDate(state.eventDate);
  document.getElementById('cd-desc').textContent = '· ' + state.eventDesc;
  document.getElementById('cd-event-name').textContent = state.eventName;
}

function formatDate(dateStr) {
  const [y,m,d] = dateStr.split('-');
  return `${y}年${parseInt(m)}月${parseInt(d)}日`;
}

function updateStats() {
  let total=0, done=0;
  state.tasks.forEach(g=>{ total+=g.items.length; done+=g.items.filter(i=>i.done).length; });
  document.getElementById('s-progress').textContent = `${done} / ${total}`;
  const spend = state.ledger.filter(r=>r.type==='out').reduce((s,r)=>s+r.amount, 0);
  document.getElementById('s-spend').textContent = Math.round(spend).toLocaleString();
  const gTotal = state.guests.reduce((s,g)=>s+g.num, 0);
  document.getElementById('s-guests').textContent = gTotal;
}

function startInlineEdit(el, value, onSave) {
  const input = document.createElement('input');
  input.type = 'text';
  input.value = value;
  input.className = 'inline-edit-input';
  el.innerHTML = '';
  el.appendChild(input);
  input.focus();
  input.select();
  const finish = () => {
    const newVal = input.value.trim();
    if (newVal && newVal !== value) {
      onSave(newVal);
    }
    el.textContent = newVal || value;
  };
  input.addEventListener('blur', finish);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') finish(); });
}

function renderOverview() {
  updateStats();

  let html = '';
  state.persons.forEach(p => {
    const myGroups = state.tasks.filter(g => g.owner === p.name);
    let pt=0, pd=0;
    myGroups.forEach(g=>{ pt+=g.items.length; pd+=g.items.filter(i=>i.done).length; });
    const pct = pt ? Math.round(pd/pt*100) : 0;

    html += `<div class="card" style="margin:0 0 10px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">
        <span class="person-tag" style="font-size:13px;padding:3px 10px;background:${p.color}20;color:${p.color};border:1px solid ${p.color}40" ondblclick="editPersonName(this,'${p.name}')">${p.name}</span>
        <span style="font-size:12px;color:#aaa;margin-left:auto">${pd}/${pt} 项 · ${pct}%</span>
        <button class="person-del" onclick="deletePerson('${p.name}')" title="删除负责人"><i class="ti ti-trash"></i></button>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${p.color}"></div></div>`;

    myGroups.forEach(g => {
      const realGi = state.tasks.indexOf(g);
      html += `<div style="margin-bottom:6px">
        <div class="group-label" ondblclick="editGroupName(this,${realGi})">${g.group}</div>`;
      g.items.forEach((item, ii) => {
        const hasNote = item.note && item.note.trim();
        html += `<div class="task-row">
          <div class="chk ${item.done?'done':''}" onclick="toggleTask(${realGi},${ii})">
            ${item.done?'<i class="ti ti-check" style="font-size:12px"></i>':''}
          </div>
          <div class="task-body">
            <div class="task-title ${item.done?'done':''}" ondblclick="editTaskTitle(this,${realGi},${ii})">${item.title}</div>
            <div class="task-meta">
              <div class="task-cost">
                <span>¥</span><input type="number" placeholder="0" value="${item.cost||''}" oninput="updateTaskCost(${realGi},${ii},this.value)" onclick="event.stopPropagation()">
                <span class="clear-cost" onclick="clearTaskCost(${realGi},${ii},this)" title="清空金额">✕</span>
              </div>
              <span class="note-toggle" onclick="toggleNoteOv(this)">${hasNote?'📝':'💬'}</span>
              <textarea class="task-note-input" rows="2" placeholder="添加备注..." oninput="updateNote(${realGi},${ii},this.value)">${item.note||''}</textarea>
            </div>
          </div>
          <button class="del-btn" onclick="delTask(${realGi},${ii})"><i class="ti ti-x"></i></button>
        </div>`;
      });
      html += `<div class="add-task-inline" onclick="addTaskInline(${realGi})"><i class="ti ti-plus"></i> 添加任务</div>`;
      html += `</div>`;
    });
    html += `</div>`;
  });
  document.getElementById('overview-persons').innerHTML = html;
}

function toggleNoteOv(el) {
  const ta = el.nextElementSibling;
  const show = ta.classList.toggle('show');
  if (show) { ta.focus(); el.textContent = '📝'; }
  else { el.textContent = ta.value.trim() ? '📝' : '💬'; }
}

function clearTaskCost(gi, ii, el) {
  event.stopPropagation();
  const input = el.parentElement.querySelector('input');
  input.value = '';
  updateTaskCost(gi, ii, '');
}

function updateTaskCost(gi, ii, value) {
  const num = parseFloat(value);
  const item = state.tasks[gi].items[ii];
  const oldCost = item.cost || 0;
  const newCost = isNaN(num) || num < 0 ? 0 : num;
  item.cost = newCost;
  if (newCost === 0 && oldCost === 0) return scheduleSave();
  const owner = state.tasks[gi].owner;
  if (item.ledgerId) {
    const record = state.ledger.find(r => r.id === item.ledgerId);
    if (record) {
      if (newCost === 0) {
        state.ledger = state.ledger.filter(r => r.id !== item.ledgerId);
        item.ledgerId = null;
      } else {
        record.amount = newCost;
        record.desc = item.title;
        record.who = owner;
      }
    } else {
      item.ledgerId = null;
    }
  }
  if (!item.ledgerId && newCost > 0) {
    const record = {
      id: 'task_' + item.id,
      desc: item.title,
      amount: newCost,
      who: owner,
      type: 'out'
    };
    state.ledger.push(record);
    item.ledgerId = record.id;
  }
  updateStats();
  renderLedger();
  scheduleSave();
}

function renderLedger() {
  const el = document.getElementById('ledger-list');
  if (!state.ledger.length) {
    el.innerHTML='<div class="empty">暂无记录</div>';
    document.getElementById('l-total').textContent='0 元';
    renderSettlement();
    return;
  }
  let total = 0;
  el.innerHTML = state.ledger.map((r,i) => {
    const isOut = r.type==='out';
    if(isOut) total += r.amount;
    return `<div class="ledger-row">
      <span style="flex:1">${r.desc} ${r.id && r.id.startsWith('task_') ? '<span style="font-size:10px;color:#BA7517">📋</span>' : ''}</span>
      <span class="person-tag" style="font-size:11px">${r.who}</span>
      <span class="${isOut?'amount-out':'amount-in'}">${isOut?'-':'+'}${Math.round(r.amount).toLocaleString()} 元</span>
      <button class="del-btn" onclick="delLedger(${i})"><i class="ti ti-x"></i></button>
    </div>`;
  }).join('');
  document.getElementById('l-total').textContent = Math.round(total).toLocaleString() + ' 元';
  document.getElementById('l-who').innerHTML = state.persons.map(p => `<option>${p.name}</option>`).join('') + '<option>共同</option>';
  renderSettlement();
}

function renderSettlement() {
  const persons = state.persons.map(p=>p.name);
  const payments = {};
  persons.forEach(p => payments[p] = 0);
  state.ledger.forEach(r => {
    if (r.type === 'out' && persons.includes(r.who)) {
      payments[r.who] += r.amount;
    }
  });
  const totalPaid = Object.values(payments).reduce((a,b)=>a+b,0);
  const perPerson = totalPaid / persons.length;
  const diffs = {};
  persons.forEach(p => diffs[p] = payments[p] - perPerson);

  let settlementHtml = '';
  if (totalPaid === 0) {
    settlementHtml = '<div class="empty">暂无个人支出</div>';
  } else {
    const debtors = [], creditors = [];
    persons.forEach(p => {
      const d = Math.round(diffs[p] * 100) / 100;
      if (d < -0.01) debtors.push({name: p, amount: -d});
      else if (d > 0.01) creditors.push({name: p, amount: d});
    });
    if (debtors.length === 0 && creditors.length === 0) {
      settlementHtml += '<div style="font-size:13px;color:#1D9E75;padding:8px 0">✅ 已平账，无需结算</div>';
    }
    const getPersonColor = (name) => {
      const person = state.persons.find(p => p.name === name);
      return person ? person.color : '#aaa';
    };
    while (debtors.length && creditors.length) {
      const debtor = debtors[0], creditor = creditors[0];
      const amount = Math.min(debtor.amount, creditor.amount);
      const debtorColor = getPersonColor(debtor.name);
      const creditorColor = getPersonColor(creditor.name);
      settlementHtml += `<div class="settlement-item">
        <span class="person-tag" style="background:${debtorColor}20;color:${debtorColor};border:1px solid ${debtorColor}40">${debtor.name}</span>
        <span style="color:#888">需支付</span>
        <span class="person-tag" style="background:${creditorColor}20;color:${creditorColor};border:1px solid ${creditorColor}40">${creditor.name}</span>
        <span style="font-weight:500;color:#A32D2D">¥${Math.round(amount*100)/100}</span>
      </div>`;
      debtor.amount = Math.round((debtor.amount - amount) * 100) / 100;
      creditor.amount = Math.round((creditor.amount - amount) * 100) / 100;
      if (debtor.amount < 0.01) debtors.shift();
      if (creditor.amount < 0.01) creditors.shift();
    }
  }
  let summaryHtml = '<div style="margin-top:10px;border-top:0.5px solid #f0ebe3;padding-top:8px;font-size:12px;color:#888">';
  persons.forEach(p => {
    const paid = Math.round(payments[p]*100)/100;
    const diff = Math.round(diffs[p]*100)/100;
    const color = state.persons.find(ps=>ps.name===p)?.color || '#aaa';
    summaryHtml += `<div style="display:flex;justify-content:space-between;margin-bottom:4px">
      <span style="color:${color}">${p}</span>
      <span>已付 ¥${paid}</span>
      <span style="color:${diff>=0?'#1D9E75':'#A32D2D'}">${diff>=0?'多付':'应付'} ¥${Math.abs(diff)}</span>
    </div>`;
  });
  summaryHtml += '</div>';
  document.getElementById('settlement-content').innerHTML = settlementHtml + summaryHtml;
}

function renderGuests() {
  const total = state.guests.reduce((s,g)=>s+g.num, 0);
  document.getElementById("g-count").textContent = total;
  document.getElementById("s-guests").textContent = total;
  document.getElementById("guest-list").innerHTML = state.guests.map((g,i)=>`
    <div class="guest-row">
      <span style="flex:1;cursor:pointer" ondblclick="editGuestName(${i}, this)">${g.name}</span>
      <button class="guest-btn" onclick="changeGuestNum(${i},-1)">−</button>
      <span style="min-width:24px;text-align:center;font-weight:500">${g.num}</span>
      <button class="guest-btn" onclick="changeGuestNum(${i},1)">+</button>
      <span style="color:#aaa;font-size:12px">人</span>
      <button class="person-del" onclick="delGuest(${i})"><i class="ti ti-trash"></i></button>
    </div>`).join("");
}

function editGuestName(i, el) {
  startInlineEdit(el, state.guests[i].name, (newName) => {
    state.guests[i].name = newName;
    renderGuests();
    scheduleSave();
  });
}

function toggleTask(gi,ii){
  state.tasks[gi].items[ii].done = !state.tasks[gi].items[ii].done;
  renderOverview();
  scheduleSave();
}
function updateNote(gi,ii,v){ state.tasks[gi].items[ii].note=v; scheduleSave(); }

function delTask(gi,ii){
  const item = state.tasks[gi].items[ii];
  if (item.ledgerId) state.ledger = state.ledger.filter(r => r.id !== item.ledgerId);
  state.tasks[gi].items.splice(ii,1);
  renderOverview();
  renderLedger();
  scheduleSave();
}

function editPersonName(el, oldName) {
  startInlineEdit(el, oldName, (newName) => {
    const person = state.persons.find(p => p.name === oldName);
    if (person && !state.persons.some(p => p.name === newName)) {
      person.name = newName;
      state.tasks.forEach(g => { if (g.owner === oldName) g.owner = newName; });
      state.ledger.forEach(r => { if (r.who === oldName) r.who = newName; });
      renderOverview();
      renderLedger();
      scheduleSave();
    }
  });
}

function editGroupName(el, gi) {
  const group = state.tasks[gi];
  startInlineEdit(el, group.group, (newName) => {
    group.group = newName;
    renderOverview();
    scheduleSave();
  });
}

function editTaskTitle(el, gi, ii) {
  const item = state.tasks[gi].items[ii];
  startInlineEdit(el, item.title, (newTitle) => {
    item.title = newTitle;
    if (item.ledgerId) {
      const record = state.ledger.find(r => r.id === item.ledgerId);
      if (record) record.desc = newTitle;
    }
    renderOverview();
    renderLedger();
    scheduleSave();
  });
}

function addTaskInline(gi) {
  const newItem = {id:'c'+Date.now(), title:'新任务', done:false, note:'', cost:0, ledgerId:null};
  state.tasks[gi].items.push(newItem);
  renderOverview();
  scheduleSave();
}

function addPerson() {
  const colors = ['#1D9E75','#7F77DD','#D4537E','#E67E22','#2980B9','#8E44AD'];
  const newName = '新成员';
  const color = colors[state.persons.length % colors.length];
  state.persons.push({name: newName, color});
  state.tasks.push({group:'新分组', owner: newName, items:[]});
  renderOverview();
  scheduleSave();
  setTimeout(() => {
    const tags = document.querySelectorAll('#overview-persons .person-tag');
    const lastTag = tags[tags.length-1];
    if (lastTag && lastTag.textContent === newName) {
      lastTag.dispatchEvent(new Event('dblclick'));
    }
  }, 100);
}

function deletePerson(name) {
  if (!confirm(`确定删除负责人“${name}”及其所有任务和记账记录吗？`)) return;
  state.persons = state.persons.filter(p => p.name !== name);
  state.tasks = state.tasks.filter(g => g.owner !== name);
  state.ledger = state.ledger.filter(r => r.who !== name);
  renderOverview();
  renderLedger();
  scheduleSave();
}

function resetData(){
  if(!confirm("确定重置？这会清除自定义内容。")) return;
  state.tasks = JSON.parse(JSON.stringify(DEFAULT_TASKS));
  state.ledger = state.ledger.filter(r => !r.id || !r.id.startsWith('task_'));
  state.persons = JSON.parse(JSON.stringify(DEFAULT_PERSONS));
  renderOverview();
  renderLedger();
  updateHeaderSub();
  scheduleSave();
  showToast("已重置");
}

function addLedger(){
  const desc=document.getElementById('l-desc').value.trim();
  const amount=parseFloat(document.getElementById('l-amount').value);
  if(!desc||isNaN(amount)||amount<=0){ showToast('请填写项目和金额'); return; }
  const who=document.getElementById('l-who').value;
  const type=document.getElementById('l-type').value;
  state.ledger.push({id:'m'+Date.now(), desc, amount, who, type});
  document.getElementById('l-desc').value=''; document.getElementById('l-amount').value='';
  renderLedger();
  updateStats();
  scheduleSave();
}
function delLedger(i){
  const record = state.ledger[i];
  if (record.id && record.id.startsWith('task_')) {
    state.tasks.forEach(g => {
      g.items.forEach(item => {
        if (item.ledgerId === record.id) {
          item.cost = 0;
          item.ledgerId = null;
        }
      });
    });
  }
  state.ledger.splice(i,1);
  renderLedger();
  renderOverview();
  scheduleSave();
}

function addGuest(){
  const name=document.getElementById('g-name').value.trim();
  const num=parseInt(document.getElementById('g-num').value)||1;
  if(!name){ showToast('请填写姓名'); return; }
  state.guests.push({name,num});
  document.getElementById('g-name').value=''; document.getElementById('g-num').value='1';
  renderGuests();
  updateStats();
  updateHeaderSub();
  scheduleSave();
}
function delGuest(i){
  state.guests.splice(i,1);
  renderGuests();
  updateStats();
  updateHeaderSub();
  scheduleSave();
}
function changeGuestNum(i, delta) {
  const newNum = state.guests[i].num + delta;
  if (newNum < 1) return;
  state.guests[i].num = newNum;
  renderGuests();
  updateStats();
  updateHeaderSub();
  scheduleSave();
}

function editMainTitle() {
  const el = document.getElementById('main-title');
  startInlineEdit(el, state.mainTitle, (newTitle) => {
    state.mainTitle = newTitle;
    updateMainTitle();
    scheduleSave();
  });
}

function editTargetDate() {
  const cur = state.eventDate;
  const span = document.getElementById('cd-target-date');
  const input = document.createElement('input');
  input.type = 'date';
  input.value = cur;
  input.className = 'inline-edit-input';
  span.innerHTML = '';
  span.appendChild(input);
  input.focus();
  input.addEventListener('blur', () => {
    const newVal = input.value;
    if (newVal && newVal !== cur) {
      state.eventDate = newVal;
      countdown();
      updateHeaderSub();
      scheduleSave();
    }
    span.textContent = formatDate(state.eventDate);
  });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); });
}

function editEventDesc() {
  const span = document.getElementById('cd-desc');
  const cur = state.eventDesc;
  const input = document.createElement('input');
  input.type = 'text';
  input.value = cur;
  input.className = 'inline-edit-input';
  span.innerHTML = '';
  span.appendChild(input);
  input.focus();
  input.addEventListener('blur', () => {
    const newVal = input.value.trim() || cur;
    if (newVal !== cur) {
      state.eventDesc = newVal;
      countdown();
      scheduleSave();
    }
    span.textContent = '· ' + state.eventDesc;
  });
}

function editEventName() {
  const span = document.getElementById('cd-event-name');
  const cur = state.eventName;
  const input = document.createElement('input');
  input.type = 'text';
  input.value = cur;
  input.className = 'inline-edit-input';
  span.innerHTML = '';
  span.appendChild(input);
  input.focus();
  input.addEventListener('blur', () => {
    const newVal = input.value.trim() || cur;
    if (newVal !== cur) {
      state.eventName = newVal;
      countdown();
      scheduleSave();
    }
    span.textContent = state.eventName;
  });
}

function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

loadRemote();
setInterval(countdown, 60000);
</script>
</body>
