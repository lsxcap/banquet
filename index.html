<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>爸爸69岁寿宴策划</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:#FFF9F2;color:#1a1a1a;min-height:100vh}
.app{max-width:640px;margin:0 auto;padding-bottom:80px}
.header{background:#fff;border-bottom:0.5px solid #e8e0d8;padding:16px 20px 0;position:sticky;top:0;z-index:100}
.header-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.h-icon{width:36px;height:36px;border-radius:50%;background:#FAEEDA;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.h-title{font-size:17px;font-weight:600}
.h-sub{font-size:12px;color:#888;margin-top:1px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#ccc;margin-left:auto;flex-shrink:0;transition:background .3s}
.sync-dot.ok{background:#1D9E75}
.sync-dot.err{background:#E24B4A}
.sync-dot.ing{background:#EF9F27}
.tabs{display:flex;border-top:0.5px solid #e8e0d8}
.tab{flex:1;padding:10px 4px;font-size:13px;color:#888;cursor:pointer;border-bottom:2px solid transparent;text-align:center;display:flex;align-items:center;justify-content:center;gap:4px;transition:all .15s}
.tab.active{color:#854F0B;border-bottom-color:#BA7517;font-weight:500}
.section{display:none;padding-top:4px}.section.active{display:block}
.countdown{margin:16px 16px 0;background:#FAEEDA;border-radius:14px;padding:20px;border:0.5px solid #EF9F27;text-align:center}
.cd-num{font-size:56px;font-weight:700;color:#633806;line-height:1;letter-spacing:-2px}
.cd-label{font-size:13px;color:#854F0B;margin-top:6px}
.cd-date{font-size:12px;color:#BA7517;margin-top:2px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 16px}
.stat{background:#fff;border-radius:10px;padding:10px 12px;border:0.5px solid #e8e0d8;text-align:center}
.stat-l{font-size:11px;color:#888;margin-bottom:3px}
.stat-v{font-size:20px;font-weight:600;color:#1a1a1a}
.stat-u{font-size:10px;color:#888}
.card{background:#fff;border-radius:14px;border:0.5px solid #e8e0d8;padding:14px 16px;margin:0 16px 12px}
.card-title{font-size:12px;font-weight:500;color:#aaa;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.person-tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:500}
.tag-妥妥{background:#E1F5EE;color:#085041}
.tag-刘娟{background:#EEEDFE;color:#3C3489}
.tag-星星{background:#FBEAF0;color:#72243E}
.tag-共同{background:#F1EFE8;color:#444441}
.progress-bar{height:4px;background:#f0ebe3;border-radius:2px;margin:6px 0 10px;overflow:hidden}
.progress-fill{height:100%;background:#1D9E75;border-radius:2px;transition:width .4s}
.task-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:0.5px solid #f5f0ea}
.task-row:last-child{border-bottom:none}
.chk{width:20px;height:20px;border-radius:6px;border:1.5px solid #d0c8be;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all .15s;color:#fff}
.chk.done{background:#1D9E75;border-color:#1D9E75}
.task-body{flex:1;min-width:0}
.task-title{font-size:14px;color:#1a1a1a;line-height:1.4}
.task-title.done{text-decoration:line-through;color:#bbb}
.task-note-input{width:100%;margin-top:5px;border:0.5px solid #e0d8d0;border-radius:7px;padding:5px 8px;font-size:12px;color:#666;font-family:inherit;background:#FFFCF8;resize:none;outline:none}
.task-note-input:focus{border-color:#BA7517}
.del-btn{background:none;border:none;cursor:pointer;color:#ccc;padding:2px 4px;border-radius:4px;font-size:14px;flex-shrink:0}
.del-btn:hover{color:#E24B4A;background:#FCEBEB}
.add-task-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:9px;border-radius:10px;border:0.5px dashed #d0c8be;background:transparent;color:#888;font-size:13px;cursor:pointer;margin:0 0 12px;font-family:inherit}
.add-task-btn:hover{border-color:#BA7517;color:#854F0B;background:#FEFAF5}
.ledger-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:0.5px solid #f5f0ea;font-size:13px}
.ledger-row:last-child{border-bottom:none}
.amount-out{color:#A32D2D;font-weight:500}
.amount-in{color:#085041;font-weight:500}
.form-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{border:0.5px solid #d8d0c8;border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit;color:#1a1a1a;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:#BA7517}
textarea{resize:vertical;min-height:80px;width:100%}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:8px;border:0.5px solid #d8d0c8;background:#fff;color:#1a1a1a;font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s}
.btn:hover{background:#f5f0ea}
.btn-primary{background:#FAEEDA;border-color:#EF9F27;color:#633806}
.btn-primary:hover{background:#FAC775}
.guest-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:0.5px solid #f5f0ea;font-size:13px}
.guest-row:last-child{border-bottom:none}
.ledger-total{display:flex;justify-content:space-between;padding-top:10px;margin-top:6px;border-top:0.5px solid #e8e0d8;font-size:13px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:18px 18px 0 0;padding:20px;width:100%;max-width:640px}
.modal-title{font-size:16px;font-weight:600;margin-bottom:14px}
.modal label{font-size:12px;color:#888;display:block;margin-bottom:4px;margin-top:10px}
.modal input,.modal select,.modal textarea{width:100%}
.modal-btns{display:flex;gap:8px;margin-top:16px}
.modal-btns button{flex:1}
.empty{color:#bbb;font-size:13px;text-align:center;padding:20px 0}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <div class="h-icon">🎂</div>
      <div>
        <div class="h-title">爸爸69岁寿宴策划</div>
        <div class="h-sub">2026年5月30日 · 共30人</div>
      </div>
      <div class="sync-dot" id="sync-dot" title="同步状态"></div>
    </div>
    <div class="tabs">
      <div class="tab active" onclick="switchTab('overview')"><i class="ti ti-home"></i> 概览</div>
      <div class="tab" onclick="switchTab('tasks')"><i class="ti ti-checklist"></i> 任务</div>
      <div class="tab" onclick="switchTab('ledger')"><i class="ti ti-receipt"></i> 记账</div>
      <div class="tab" onclick="switchTab('guests')"><i class="ti ti-users"></i> 宾客</div>
      <div class="tab" onclick="switchTab('notes')"><i class="ti ti-notes"></i> 备忘</div>
    </div>
  </div>

  <!-- 概览 -->
  <div class="section active" id="tab-overview">
    <div class="countdown">
      <div class="cd-num" id="cd-days">--</div>
      <div class="cd-label">距离寿宴还有（天）</div>
      <div class="cd-date">2026年5月30日 · 爸爸69岁生日</div>
    </div>
    <div class="stat-grid">
      <div class="stat"><div class="stat-l">总任务</div><div class="stat-v" id="s-total">0</div></div>
      <div class="stat"><div class="stat-l">已完成</div><div class="stat-v" id="s-done" style="color:#1D9E75">0</div></div>
      <div class="stat"><div class="stat-l">宾客</div><div class="stat-v" id="s-guests">0</div><div class="stat-u">人</div></div>
      <div class="stat"><div class="stat-l">已支出</div><div class="stat-v" id="s-spend">0</div><div class="stat-u">元</div></div>
    </div>
    <div style="padding:0 16px;margin-bottom:12px">
      <div style="font-size:13px;color:#888;margin-bottom:8px">各负责人进度</div>
      <div id="overview-persons"></div>
    </div>
  </div>

  <!-- 任务 -->
  <div class="section" id="tab-tasks">
    <div style="height:12px"></div>
    <div id="task-groups"></div>
    <div style="padding:0 16px">
      <button class="add-task-btn" onclick="openAddTask()"><i class="ti ti-plus"></i> 添加任务</button>
    </div>
  </div>

  <!-- 记账 -->
  <div class="section" id="tab-ledger">
    <div style="height:12px"></div>
    <div class="card">
      <div class="card-title">新增记录</div>
      <div class="form-row">
        <input type="text" id="l-desc" placeholder="项目名称" style="flex:2;min-width:120px">
        <input type="number" id="l-amount" placeholder="金额(元)" style="width:100px" min="0">
      </div>
      <div class="form-row" style="margin-top:8px">
        <select id="l-who" style="flex:1">
          <option>妥妥</option><option>刘娟</option><option>星星</option><option>共同</option>
        </select>
        <select id="l-type" style="flex:1">
          <option value="out">支出</option><option value="in">收入/报销</option>
        </select>
        <button class="btn btn-primary" onclick="addLedger()"><i class="ti ti-plus"></i> 记录</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">支出明细</div>
      <div id="ledger-list"><div class="empty">暂无记录</div></div>
      <div class="ledger-total">
        <span style="color:#888">总支出</span>
        <span id="l-total" style="font-weight:500;color:#A32D2D">0 元</span>
      </div>
    </div>
  </div>

  <!-- 宾客 -->
  <div class="section" id="tab-guests">
    <div style="height:12px"></div>
    <div class="card">
      <div class="card-title">宾客名单 · 共 <span id="g-count">0</span> 人</div>
      <div id="guest-list"></div>
    </div>
    <div class="card">
      <div class="card-title">添加宾客</div>
      <div class="form-row">
        <input type="text" id="g-name" placeholder="姓名/称呼" style="flex:2;min-width:120px">
        <input type="number" id="g-num" placeholder="人数" style="width:70px" min="1" value="1">
        <button class="btn btn-primary" onclick="addGuest()"><i class="ti ti-plus"></i> 添加</button>
      </div>
    </div>
  </div>

  <!-- 备忘 -->
  <div class="section" id="tab-notes">
    <div style="height:12px"></div>
    <div class="card">
      <div class="card-title">🏨 酒店对接备忘（妥妥）</div>
      <textarea id="note-hotel" placeholder="包厢/大厅选择、桌数、场地费押金、联系人电话..." oninput="saveNotes()"></textarea>
    </div>
    <div class="card">
      <div class="card-title">🍜 菜品 & 蛋糕备忘（刘娟）</div>
      <textarea id="note-food" placeholder="菜单详情、试菜时间、蛋糕尺寸口味主题、配送时间..." oninput="saveNotes()"></textarea>
    </div>
    <div class="card">
      <div class="card-title">🛍 采购 & 寿包寿桃备忘（星星）</div>
      <textarea id="note-buy" placeholder="爸爸衣服尺码颜色、迎宾台物料清单、寿包寿桃数量口味取货时间..." oninput="saveNotes()"></textarea>
    </div>
    <div class="card">
      <div class="card-title">📋 其他备忘</div>
      <textarea id="note-other" placeholder="流程安排、注意事项、停车引导..." oninput="saveNotes()"></textarea>
    </div>
  </div>
</div>

<!-- 添加任务弹窗 -->
<div class="modal-bg" id="modal-add-task">
  <div class="modal">
    <div class="modal-title">添加任务</div>
    <label>任务名称</label>
    <input type="text" id="at-title" placeholder="输入任务名称">
    <label>负责人</label>
    <select id="at-owner">
      <option>妥妥</option><option>刘娟</option><option>星星</option>
    </select>
    <label>所属分组</label>
    <select id="at-group"></select>
    <div class="modal-btns">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="confirmAddTask()"><i class="ti ti-check"></i> 确认添加</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const BIN_ID_KEY = 'banquet_bin_id';
const API_KEY = '$2a$10$MjjZl03Z83bbIAiR/s4gaezlxBIJuxYEwOSM/L/p4giJ6tX8yzslK';
const BASE_URL = 'https://api.jsonbin.io/v3';

const DEFAULT_TASKS = [
  {group:'酒店对接',owner:'妥妥',items:[
    {id:'t1',title:'确认宴会日期（2026年5月30日）',done:false,note:''},
    {id:'t2',title:'预定包厢/大厅，确认桌数',done:false,note:''},
    {id:'t3',title:'确认场地费与押金金额',done:false,note:''},
    {id:'t4',title:'签订场地协议',done:false,note:''},
  ]},
  {group:'菜品与餐饮',owner:'刘娟',items:[
    {id:'t5',title:'与酒店沟通寿宴特色菜选项',done:false,note:''},
    {id:'t6',title:'安排试菜',done:false,note:''},
    {id:'t7',title:'确定最终菜单（含分量、口味）',done:false,note:''},
  ]},
  {group:'采购与布置',owner:'星星',items:[
    {id:'t8',title:'购买爸爸寿宴衣服',done:false,note:''},
    {id:'t9',title:'采购迎宾台物料（KT板、卡片、指引牌）',done:false,note:''},
    {id:'t10',title:'迎宾台装饰准备到位',done:false,note:''},
  ]},
  {group:'寿包 & 寿桃',owner:'星星',items:[
    {id:'t11',title:'预定寿包（数量、口味确认）',done:false,note:''},
    {id:'t12',title:'预定寿桃（数量、口味确认）',done:false,note:''},
    {id:'t13',title:'确认取货时间',done:false,note:''},
  ]},
  {group:'寿宴蛋糕',owner:'刘娟',items:[
    {id:'t14',title:'确定蛋糕尺寸、口味、主题',done:false,note:''},
    {id:'t15',title:'预定蛋糕（确认配送/自提时间）',done:false,note:''},
  ]},
];

const DEFAULT_GUESTS = [
  {name:'大姑家（大姑爷、刘丽）',num:3},{name:'大姑家（斌一家）',num:4},
  {name:'二姑家（二姑爷、玉芝）',num:4},{name:'小姑家',num:3},
  {name:'万和',num:3},{name:'妥妥一家',num:4},{name:'刘娟一家',num:3},
  {name:'百和叔叔',num:2},{name:'千和叔叔',num:2},
];

let state = {
  tasks: JSON.parse(JSON.stringify(DEFAULT_TASKS)),
  ledger: [],
  guests: JSON.parse(JSON.stringify(DEFAULT_GUESTS)),
  notes: {hotel:'',food:'',buy:'',other:''}
};

let binId = localStorage.getItem(BIN_ID_KEY) || null;
let saveTimer = null;

// ── JSONBin ──────────────────────────────────────
async function loadRemote() {
  setSyncDot('ing');
  try {
    if (!binId) {
      // 创建新bin
      const res = await fetch(`${BASE_URL}/b`, {
        method:'POST',
        headers:{'Content-Type':'application/json','X-Master-Key':API_KEY,'X-Bin-Name':'banquet','X-Bin-Private':'false'},
        body: JSON.stringify(state)
      });
      const data = await res.json();
      binId = data.metadata.id;
      localStorage.setItem(BIN_ID_KEY, binId);
      setSyncDot('ok');
    } else {
      const res = await fetch(`${BASE_URL}/b/${binId}/latest`, {
        headers:{'X-Master-Key':API_KEY}
      });
      const data = await res.json();
      if (data.record) {
        state = Object.assign({tasks:DEFAULT_TASKS,ledger:[],guests:DEFAULT_GUESTS,notes:{hotel:'',food:'',buy:'',other:''}}, data.record);
      }
      setSyncDot('ok');
    }
  } catch(e) {
    setSyncDot('err');
    showToast('加载失败，使用本地数据');
  }
  renderAll();
}

async function saveRemote() {
  setSyncDot('ing');
  try {
    await fetch(`${BASE_URL}/b/${binId}`, {
      method:'PUT',
      headers:{'Content-Type':'application/json','X-Master-Key':API_KEY},
      body: JSON.stringify(state)
    });
    setSyncDot('ok');
  } catch(e) {
    setSyncDot('err');
    showToast('同步失败，请检查网络');
  }
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveRemote, 800);
}

function setSyncDot(s) {
  const d = document.getElementById('sync-dot');
  d.className = 'sync-dot' + (s ? ' ' + s : '');
  d.title = s==='ok'?'已同步':s==='ing'?'同步中...':s==='err'?'同步失败':'';
}

// ── Tab ──────────────────────────────────────────
function switchTab(t) {
  document.querySelectorAll('.tab').forEach((el,i)=>{
    el.classList.toggle('active',['overview','tasks','ledger','guests','notes'][i]===t);
  });
  document.querySelectorAll('.section').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
}

// ── 渲染 ─────────────────────────────────────────
function renderAll() {
  countdown();
  renderOverview();
  renderTasks();
  renderLedger();
  renderGuests();
  renderNotes();
}

function countdown() {
  const target = new Date('2026-05-30T00:00:00');
  const now = new Date();
  const diff = Math.ceil((target - now) / (1000*60*60*24));
  document.getElementById('cd-days').textContent = diff > 0 ? diff : (diff === 0 ? '今天' : '已过');
}

function renderOverview() {
  let total=0, done=0;
  state.tasks.forEach(g=>{ total+=g.items.length; done+=g.items.filter(i=>i.done).length; });
  document.getElementById('s-total').textContent = total;
  document.getElementById('s-done').textContent = done;
  const gTotal = state.guests.reduce((s,g)=>s+g.num,0);
  document.getElementById('s-guests').textContent = gTotal;
  const spend = state.ledger.filter(r=>r.type==='out').reduce((s,r)=>s+r.amount,0);
  document.getElementById('s-spend').textContent = Math.round(spend).toLocaleString();

  // 人员进度
  const persons = ['妥妥','刘娟','星星'];
  const colors = {'妥妥':'#1D9E75','刘娟':'#7F77DD','星星':'#D4537E'};
  let html = '';
  persons.forEach(p => {
    let pt=0,pd=0;
    state.tasks.forEach(g=>{ if(g.owner===p){ pt+=g.items.length; pd+=g.items.filter(i=>i.done).length; } });
    const pct = pt ? Math.round(pd/pt*100) : 0;
    html += `<div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
        <span class="person-tag tag-${p}">${p}</span>
        <span style="color:#888">${pd}/${pt} 项 · ${pct}%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${colors[p]}"></div></div>
    </div>`;
  });
  document.getElementById('overview-persons').innerHTML = html;
}

function renderTasks() {
  let html = '';
  state.tasks.forEach((g, gi) => {
    const done = g.items.filter(i=>i.done).length;
    const pct = g.items.length ? Math.round(done/g.items.length*100) : 0;
    html += `<div class="card">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">
        <span style="font-size:14px;font-weight:500">${g.group}</span>
        <span class="person-tag tag-${g.owner}">${g.owner}</span>
        <span style="margin-left:auto;font-size:12px;color:#aaa">${done}/${g.items.length}</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`;
    g.items.forEach((item, ii) => {
      html += `<div class="task-row">
        <div class="chk ${item.done?'done':''}" onclick="toggleTask(${gi},${ii})">
          ${item.done?'<i class="ti ti-check" style="font-size:12px"></i>':''}
        </div>
        <div class="task-body">
          <div class="task-title ${item.done?'done':''}">${item.title}</div>
          <textarea class="task-note-input" rows="1" placeholder="备注..." oninput="updateNote(${gi},${ii},this.value)">${item.note||''}</textarea>
        </div>
        <button class="del-btn" onclick="delTask(${gi},${ii})"><i class="ti ti-x"></i></button>
      </div>`;
    });
    html += `</div>`;
  });
  document.getElementById('task-groups').innerHTML = html;
}

function renderLedger() {
  const el = document.getElementById('ledger-list');
  if (!state.ledger.length) { el.innerHTML='<div class="empty">暂无记录</div>'; document.getElementById('l-total').textContent='0 元'; document.getElementById('s-spend').textContent='0'; return; }
  let total = 0;
  el.innerHTML = state.ledger.map((r,i) => {
    const isOut = r.type==='out';
    if(isOut) total += r.amount;
    return `<div class="ledger-row">
      <span style="flex:1">${r.desc}</span>
      <span class="person-tag tag-${r.who==='共同'?'共同':r.who}" style="font-size:11px">${r.who}</span>
      <span class="${isOut?'amount-out':'amount-in'}">${isOut?'-':'+'}${Math.round(r.amount).toLocaleString()} 元</span>
      <button class="del-btn" onclick="delLedger(${i})"><i class="ti ti-x"></i></button>
    </div>`;
  }).join('');
  document.getElementById('l-total').textContent = Math.round(total).toLocaleString() + ' 元';
  document.getElementById('s-spend').textContent = Math.round(total).toLocaleString();
}

function renderGuests() {
  const total = state.guests.reduce((s,g)=>s+g.num,0);
  document.getElementById('g-count').textContent = total;
  document.getElementById('s-guests').textContent = total;
  document.getElementById('guest-list').innerHTML = state.guests.map((g,i)=>`
    <div class="guest-row">
      <span style="flex:1">${g.name}</span>
      <span style="color:#888;font-size:12px">${g.num} 人</span>
      <button class="del-btn" onclick="delGuest(${i})"><i class="ti ti-x"></i></button>
    </div>`).join('');
}

function renderNotes() {
  ['hotel','food','buy','other'].forEach(k=>{
    document.getElementById('note-'+k).value = state.notes[k] || '';
  });
}

// ── 操作 ─────────────────────────────────────────
function toggleTask(gi,ii){ state.tasks[gi].items[ii].done=!state.tasks[gi].items[ii].done; renderTasks(); renderOverview(); scheduleSave(); }
function updateNote(gi,ii,v){ state.tasks[gi].items[ii].note=v; scheduleSave(); }
function delTask(gi,ii){ state.tasks[gi].items.splice(ii,1); renderTasks(); renderOverview(); scheduleSave(); }

function openAddTask() {
  const sel = document.getElementById('at-group');
  sel.innerHTML = state.tasks.map((g,i)=>`<option value="${i}">${g.group}（${g.owner}）</option>`).join('');
  document.getElementById('at-title').value='';
  document.getElementById('modal-add-task').classList.add('show');
}
function closeModal(){ document.getElementById('modal-add-task').classList.remove('show'); }
function confirmAddTask(){
  const title = document.getElementById('at-title').value.trim();
  if(!title){ showToast('请填写任务名称'); return; }
  const gi = parseInt(document.getElementById('at-group').value);
  state.tasks[gi].items.push({id:'c'+Date.now(),title,done:false,note:''});
  closeModal(); renderTasks(); renderOverview(); scheduleSave();
}

function addLedger(){
  const desc=document.getElementById('l-desc').value.trim();
  const amount=parseFloat(document.getElementById('l-amount').value);
  if(!desc||isNaN(amount)||amount<=0){ showToast('请填写项目和金额'); return; }
  const who=document.getElementById('l-who').value;
  const type=document.getElementById('l-type').value;
  state.ledger.push({desc,amount,who,type});
  document.getElementById('l-desc').value=''; document.getElementById('l-amount').value='';
  renderLedger(); renderOverview(); scheduleSave();
}
function delLedger(i){ state.ledger.splice(i,1); renderLedger(); renderOverview(); scheduleSave(); }

function addGuest(){
  const name=document.getElementById('g-name').value.trim();
  const num=parseInt(document.getElementById('g-num').value)||1;
  if(!name){ showToast('请填写姓名'); return; }
  state.guests.push({name,num});
  document.getElementById('g-name').value=''; document.getElementById('g-num').value='1';
  renderGuests(); renderOverview(); scheduleSave();
}
function delGuest(i){ state.guests.splice(i,1); renderGuests(); renderOverview(); scheduleSave(); }

function saveNotes(){
  ['hotel','food','buy','other'].forEach(k=>{ state.notes[k]=document.getElementById('note-'+k).value; });
  scheduleSave();
}

function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

// ── 关闭弹窗点击背景 ─────────────────────────────
document.getElementById('modal-add-task').addEventListener('click', function(e){ if(e.target===this) closeModal(); });

// ── 启动 ─────────────────────────────────────────
loadRemote();
setInterval(countdown, 60000);
</script>
</body>
</html>
